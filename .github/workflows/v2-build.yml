name: Club BASA V2 build
on:
  push:
    paths: ['v2/**']
  pull_request:
    paths: ['v2/**']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/package.json
      - run: npm install
      - run: npm run build